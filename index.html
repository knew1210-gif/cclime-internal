<title>JINIUS* 재무 별자리</title>
<style>
:root { color-scheme: light dark;
  --bg: #f6f7f9; --paper: #ffffff; --ink: #1b2330; --muted: #5d6878; --line: #dde2e9; --accent: #2f5bd3; --bad: #b42318;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --paper: #1a2029; --ink: #e6eaf0; --muted: #9aa5b5; --line: #2c3440; --accent: #7d9cf0; --bad: #f97066; } }
:root[data-theme="dark"] {
  --bg: #12161d; --paper: #1a2029; --ink: #e6eaf0; --muted: #9aa5b5; --line: #2c3440; --accent: #7d9cf0; --bad: #f97066; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); }
form { width: 100%; max-width: 360px; display: grid; gap: 14px; padding: 28px 24px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
h1 { margin: 0; font-size: 1.15rem; }
p { margin: 0; color: var(--muted); font-size: .9rem; }
input[type=password] { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.keep { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .88rem; }
button { font: 700 .95rem var(--sans); padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--bad); min-height: 1.4em; }
</style>

</form>
